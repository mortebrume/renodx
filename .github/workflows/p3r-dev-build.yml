# Fork-only dev build. Lives in the `p3r-dev` change on top of the PR stack,
# never in the PR itself (upstream forbids CI changes in mod PRs).
# Mirrors upstream's clang-x64.yml, but builds only the targets we need and
# uploads them as an artifact for `bin/lab ci-fetch`.
name: P3R dev build

on:
  workflow_dispatch:
  push:
    branches: [p3r-dev]

jobs:
  build:
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: "5G"
      SCCACHE_C_CUSTOM_CACHE_BUSTER: "${{ github.workflow }}"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Set up shader tools
        shell: pwsh
        run: .\scripts\setup-dev-env.ps1 -Update -Tools dxc,slang,glslang

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: x64

      - name: Configure build for amd64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure CMake (x64)
        run: cmake --preset clang-x64 -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build addon, devkit and MCP bridge
        run: cmake --build --preset clang-x64-release --target unrealengine devkit mcp_bridge

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: renodx-p3r-dev
          if-no-files-found: error
          path: |
            build/release/renodx-unrealengine.addon64
            build/release/renodx-unrealengine.pdb
            build/release/renodx-devkit.addon64
            build/release/renodx-mcp-bridge.exe
